name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      EGIS_REQUIRE_DBUS_TEST: "1"
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libdbus-1-dev libcairo2-dev libgirepository-2.0-dev libgirepository1.0-dev pkg-config
      - name: Install project
        run: python -m pip install .
      - name: Validate
        run: ./tools/check

  arch-package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v5
      - name: Build deterministic release and package
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./tools/build-release --output dist/release
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/dist/release' && makepkg --noconfirm --nodeps"

  fedora-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build deterministic release
        run: ./tools/build-release --output dist/release
      - name: Build RPM
        run: |
          docker run --rm -v "$PWD:/src" -w /src fedora:latest bash -c '
            dnf install -y git python3 rpm-build systemd-rpm-macros &&
            mkdir -p /tmp/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} &&
            cp dist/release/open-fprintd-eh575-0.4.0.tar.gz /tmp/rpmbuild/SOURCES/ &&
            rpmbuild -ba packaging/fedora/open-fprintd-eh575.spec --define "_topdir /tmp/rpmbuild"
          '
